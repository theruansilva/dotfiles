gui:
  # stuff relating to the UI
  screenMode: "normal" # one of 'normal' | 'half' | 'full' default is 'normal'
  scrollHeight: 4 # how many lines you scroll by
  scrollPastBottom: true # enable scrolling past the bottom
  sidePanelWidth: 0.3333 # number from 0 to 1
  expandFocusedSidePanel: false
  mainPanelSplitMode: "flexible" # one of 'horizontal' | 'flexible' | 'vertical'
  language: "auto" # one of 'auto' | 'en' | 'zh' | 'pl' | 'nl' | 'ja' | 'ko'
  timeFormat: "02 Jan 06 15:04 MST" # https://pkg.go.dev/time#Time.Format
  theme:
    activeBorderColor:
      - green
      - bold
    inactiveBorderColor:
      - white
    optionsTextColor:
      - blue
    selectedLineBgColor:
      - blue # set to `default` to have no background colour
    selectedRangeBgColor:
      - blue
    cherryPickedCommitBgColor:
      - cyan
    cherryPickedCommitFgColor:
      - blue
    unstagedChangesColor:
      - red
    defaultFgColor:
      - default
  commitLength:
    show: true
  mouseEvents: true
  skipDiscardChangeWarning: false
  skipStashWarning: false
  skipSwitchWorktreeOnCheckoutWarning: false
  showFileTree: true # for rendering changes files in a tree format
  showListFooter: true # for seeing the '5 of 20' message in list panels
  showRandomTip: false
  experimentalShowBranchHeads: false # visualize branch heads with (*) in commits list
  showBottomLine: false # for hiding the bottom information line (unless it has important information to tell you)
  showCommandLog: false
  showIcons: true
  commandLogSize: 8
  splitDiff: "auto" # one of 'auto' | 'always'
  skipRewordInEditorWarning: false # for skipping the confirmation before launching the reword editor
  border: "rounded" # one of 'single' | 'double' | 'rounded' | 'hidden'
git:
  pagers:
    - colorArg: always
      useConfig: false
  commit:
    signOff: false
    verbose: aways # one of 'default' | 'always' | 'never'
  merging:
    # only applicable to unix users
    manualCommit: false
    # extra args passed to `git merge`, e.g. --no-ff
    args: ""
  log:
    # one of date-order, author-date-order, topo-order or default.
    # topo-order makes it easier to read the git log graph, but commits may not
    # appear chronologically. See https://git-scm.com/docs/git-log#_commit_ordering
    order: "topo-order"
    # one of always, never, when-maximised
    # this determines whether the git graph is rendered in the commits panel
    showGraph: "when-maximised"
    # displays the whole git graph by default in the commits panel (equivalent to passing the `--all` argument to `git log`)
    showWholeGraph: false
  skipHookPrefix: WIP
  autoFetch: true
  autoRefresh: true
  branchLogCmd: "git log --graph --color=always --abbrev-commit --decorate --date=relative --pretty=medium {{branchName}} --"
  overrideGpg: false # prevents lazygit from spawning a separate process when using GPG
  disableForcePushing: false
  parseEmoji: false
  diffContextSize: 3 # how many lines of context are shown around a change in diffs
  allBranchesLogCmds:
    - git log --graph --all --color=always --abbrev-commit --decorate --date=relative  --pretty=medium
os:
  editPreset: "nvim" # see 'Configuring File Editing' section
  edit: "nvim"
  editAtLine: "nvim"
  editAtLineAndWait: "nvim"
  open: "nvim"
  openLink: "microsoft-edge-beta"
refresher:
  refreshInterval: 10 # File/submodule refresh interval in seconds. Auto-refresh can be disabled via option 'git.autoRefresh'.
  fetchInterval: 60 # Re-fetch interval in seconds. Auto-fetch can be disabled via option 'git.autoFetch'.
update:
  method: prompt # can be: prompt | background | never
  days: 1 # how often an update is checked for
confirmOnQuit: false
# determines whether hitting 'esc' will quit the application when there is nothing to cancel/close
quitOnTopLevelReturn: false
disableStartupPopups: false
notARepository: "prompt" # one of: 'prompt' | 'create' | 'skip' | 'quit'
promptToReturnFromSubprocess: true # display confirmation when subprocess terminates
keybinding:
  universal:
    quit: ","
    quit-alt1: "q" # alternative/alias of quit
    return: "<esc>" # return to previous menu, will quit if there's nowhere to return
    quitWithoutChangingDirectory: "<c-c>"
    # togglePanel: "<tab>" # goto the next panel
    prevItem: "k" # go one line up
    nextItem: "j" # go one line down
    prevItem-alt: "" # go one line up
    nextItem-alt: "" # go one line down
    prevPage: "" # go to next page in list
    nextPage: "" # go to previous page in list
    gotoTop: "G" # go to top of list
    gotoBottom: "" # go to bottom of list
    scrollLeft: "" # scroll left within list view
    scrollRight: "" # scroll right within list view
    prevBlock: "h" # goto the previous block / panel
    nextBlock: "l" # goto the next block / panel
    prevBlock-alt: "" # goto the previous block / panel
    nextBlock-alt: "" # goto the next block / panel
    # jumpToBlock: ["1", "2", "3", "4", "5"] # goto the Nth block / panel
    nextMatch: "N"
    prevMatch: "M"
    optionMenu: <disabled> # show help menu
    optionMenu-alt1: "?" # show help menu
    select: "<space>"
    goInto: "f"
    openRecentRepos: "<c-r>"
    confirm: "<enter>"
    remove: "d"
    new: "n"
    edit: "e"
    openFile: "o"
    scrollUpMain: "[" # main panel scroll up
    scrollDownMain: "]" # main panel scroll down
    scrollUpMain-alt1: "" # main panel scroll up
    scrollDownMain-alt1: "" # main panel scroll down
    scrollUpMain-alt2: "" # main panel scroll up
    scrollDownMain-alt2: "" # main panel scroll down
    executeShellCommand: ":"
    createRebaseOptionsMenu: "m"
    pushFiles: "P"
    pullFiles: "p"
    refresh: "R"
    createPatchOptionsMenu: "<c-p>"
    nextTab: "L"
    prevTab: "H"
    nextScreenMode: "+"
    prevScreenMode: "_"
    undo: "u"
    redo: "<c-z>"
    filteringMenu: "<c-s>"
    diffingMenu: "W"
    diffingMenu-alt: "<c-e>" # deprecated
    copyToClipboard: "<c-o>"
    submitEditorText: "<enter>"
    extrasMenu: "@"
    toggleWhitespaceInDiffView: "<c-w>"
    increaseContextInDiffView: "h"
    decreaseContextInDiffView: "l"
  status:
    checkForUpdate: "U"
    recentRepos: "<enter>"
  files:
    commitChanges: "C"
    commitChangesWithoutHook: "w" # commit changes without pre-commit hook
    amendLastCommit: "A"
    commitChangesWithEditor: "e"
    ignoreFile: "I"
    refreshFiles: "r"
    stashAllChanges: "s"
    viewStashOptions: "S"
    toggleStagedAll: "a" # stage/unstage all
    viewResetOptions: "D"
    fetch: "F"
    toggleTreeView: "`"
    openMergeOptions: "M"
    openStatusFilter: "<c-b>"
  branches:
    createPullRequest: ""
    viewPullRequestOptions: "o"
    checkoutBranchByName: "C"
    forceCheckoutBranch: "F"
    rebaseBranch: "r"
    renameBranch: "R"
    mergeIntoCurrentBranch: "M"
    viewGitFlowOptions: "i"
    fastForward: "F" # fast-forward this branch from its upstream
    createTag: "t"
    pushTag: "T"
    setUpstream: "U" # set as upstream of checked-out branch
    fetchRemote: "F"
  commits:
    squashDown: "s"
    renameCommit: "R"
    renameCommitWithEditor: "r"
    viewResetOptions: "g"
    markCommitAsFixup: "m"
    createFixupCommit: "M" # create fixup commit for this commit
    squashAboveCommits: "S"
    moveDownCommit: "<c-j>" # move commit down one
    moveUpCommit: "<c-k>" # move commit up one
    amendToCommit: "A"
    pickCommit: "P" # pick commit (when mid-rebase)
    revertCommit: "F"
    cherryPickCopy: "c"
    cherryPickCopyRange: "C"
    pasteCommits: "p"
    tagCommit: "t"
    checkoutCommit: "<space>"
    resetCherryPick: "<c-r>"
    copyCommitMessageToClipboard: "<c-y>"
    openLogMenu: "<c-l>"
    viewBisectOptions: "b"
  stash:
    popStash: "s"
    renameStash: "r"
  commitFiles:
    checkoutCommitFile: "c"
  main:
    toggleDragSelect: "v"
    toggleDragSelect-alt: "V"
    toggleSelectHunk: "a"
    pickBothHunks: "b"
  submodules:
    init: "i"
    update: "u"
    bulkMenu: "b"
# Access these custom commands by pressing 'o' on the status panel from within lazygit
customCommands:
  - key: "c"
    command: "gitmoji -c"
    context: "files"
    output: terminal
  - key: "a"
    command: "wt switch --create '{{.Form.WorktreeName}}'"
    context: "worktrees"
    prompts:
      - type: "input"
        title: "New worktree name"
        key: "WorktreeName"
    output: terminal
  - key: "d"
    command: 'wt remove "{{.SelectedWorktree.Branch}}" --force'
    context: "worktrees"
    prompts:
      - type: "confirm"
        title: "Remove worktree"
        body: 'Are you sure you want to remove worktree "{{.SelectedWorktree.Name}}" (branch: {{.SelectedWorktree.Branch}})?'
    output: terminal
